services:
  metadata-bridge:
    image: python:3.12-alpine
    container_name: homedocker-metadata-bridge
    network_mode: host
    user: "65534:65534"
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    environment:
      SH_MANIFEST_URL: ${SH_MANIFEST_URL:?Set in .env}
      SH2_MANIFEST_URL: ${SH2_MANIFEST_URL:?Set in .env}
      # Optional: official TMDB rich TV cast (Bearer token, never committed)
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      LISTEN_HOST: "127.0.0.1"
      LISTEN_PORT: "18123"
      UPSTREAM_TIMEOUT: "7"
      CACHE_ITEMS: "128"
      META_TTL_SECONDS: "1800"
      SEARCH_TTL_SECONDS: "300"
      OVERRIDES_FILE: "/app/overrides.json"
    volumes:
      - ./bridge.py:/app/bridge.py:ro
      - ./overrides.json:/app/overrides.json:ro
    working_dir: /app
    command: ["python", "-B", "/app/bridge.py"]
    restart: unless-stopped
    healthcheck:
      # BusyBox is included in python:3.12-alpine; avoid a second Python process.
      test: ["CMD", "/bin/busybox", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:18123/health"]
      interval: 45s
      timeout: 12s
      retries: 3
      start_period: 30s

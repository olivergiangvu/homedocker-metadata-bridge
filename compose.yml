services:
  metadata-bridge:
    image: python:3.12-alpine
    container_name: homedocker-metadata-bridge
    network_mode: host
    user: "65534:65534"
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    environment:
      SH_MANIFEST_URL: ${SH_MANIFEST_URL:?Set in .env}
      SH2_MANIFEST_URL: ${SH2_MANIFEST_URL:?Set in .env}
      LISTEN_HOST: "127.0.0.1"
      LISTEN_PORT: "18123"
      UPSTREAM_TIMEOUT: "7"
      CACHE_ITEMS: "128"
      META_TTL_SECONDS: "1800"
      SEARCH_TTL_SECONDS: "300"
      OVERRIDES_FILE: "/app/overrides.json"
    volumes:
      - ./bridge.py:/app/bridge.py:ro
      - ./overrides.json:/app/overrides.json:ro
    working_dir: /app
    command: ["python", "-B", "/app/bridge.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-B", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18123/health',timeout=2).close()"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 15s

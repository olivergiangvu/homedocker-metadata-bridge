name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Unit tests and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q bridge.py scripts tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate Docker Compose (no real credentials)
        env:
          SH_MANIFEST_URL: http://127.0.0.1:3232/placeholder-sh/manifest.json
          SH2_MANIFEST_URL: http://127.0.0.1:3232/placeholder-sh2/manifest.json
        run: docker compose -f compose.yml config -q
      - name: Smoke-test BusyBox healthcheck (no private upstreams)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 18123 --bind 127.0.0.1 >/tmp/bridge-health-test.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 1 http://127.0.0.1:18123/ >/dev/null; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" -eq 1
          docker run --rm --network host --user 65534:65534 --read-only \
            --memory 128m --cpus 0.50 python:3.12-alpine \
            /bin/busybox wget -q -T 3 -O /dev/null http://127.0.0.1:18123/
      - name: Ensure local secrets are not tracked
        shell: bash
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo 'ERROR: .env is tracked and may contain secrets.' >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(__pycache__|\.venv)(/|$)|\.pyc$'; then
            echo 'ERROR: generated artifacts are tracked.' >&2
            exit 1
          fi
